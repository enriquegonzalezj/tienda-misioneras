# Receta de Render para la tienda (tarea 1.4). Render la lee al crear el Blueprint.
# Referencia: https://render.com/docs/blueprint-spec
# Región, nombres, base interna y usuario no se pueden cambiar después de crear.

services:
  - type: web
    name: tienda-vocaciones-mhpvm
    runtime: python
    region: ohio
    plan: 0.5c-512mb # 7 USD al mes
    numInstances: 1
    buildCommand: "bash render_build.sh"
    # Migraciones justo antes de publicar: si fallan, el despliegue se cancela
    # y sigue funcionando la versión anterior.
    preDeployCommand: "pipenv run upgrade"
    # Un solo proceso: el límite de intentos vive en la memoria de ese proceso.
    startCommand: "gunicorn wsgi --chdir ./src/ --workers 1"
    # Render no manda tráfico a una versión nueva hasta que esta ruta responde bien.
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_APP
        value: src/app.py
      # La consola de depuración de Werkzeug permite ejecutar código: nunca en producción.
      - key: FLASK_DEBUG
        value: 0
      # Render la genera (256 bits) y nadie la ve; distinta de la llave local.
      - key: JWT_SECRET_KEY
        generateValue: true
      # Render pide estos valores en el panel al crear el Blueprint (no van en git).
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: tienda-mhpvm-db
          property: connectionString
      # TRUSTED_PROXY_HOPS se pone a mano en el panel después de medir los saltos
      # de X-Forwarded-For. Mientras falte vale 0 (ver src/app.py).

databases:
  - name: tienda-mhpvm-db
    region: ohio
    plan: 0.1c-256mb # 6 USD al mes
    postgresMajorVersion: "18"
    databaseName: tienda_prod
    user: tienda_app
    ipAllowList: [] # solo conexiones internas de Render, nunca desde fuera
